# HTTP: redirect everything to HTTPS. The ACME standalone challenge (see
# scripts/setup-truehost.sh / docs) briefly stops this whole nginx container
# to free port 80 for certbot rather than being served through here, so this
# block doesn't need its own /.well-known/acme-challenge/ location.
server {
    listen 80;
    server_name tweakhub.co.za www.tweakhub.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tweakhub.co.za www.tweakhub.co.za;

    ssl_certificate /etc/letsencrypt/live/tweakhub.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tweakhub.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 500M;  # match Business-tier max upload

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # large-file conversions can run long
    }

    location /health {
        proxy_pass http://api:3001/health;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
