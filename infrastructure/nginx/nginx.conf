# Placeholder HTTP config — run `certbot --nginx -d tweakhub.co.za -d www.tweakhub.co.za`
# on the VPS after this is deployed once to auto-upgrade this to HTTPS with
# a Let's Encrypt cert (see scripts/setup-truehost.sh, step 4).

server {
    listen 80;
    server_name tweakhub.co.za www.tweakhub.co.za;

    client_max_body_size 500M;  # match Business-tier max upload

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # large-file conversions can run long
    }

    location /health {
        proxy_pass http://api:3001/health;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
