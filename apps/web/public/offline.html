<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TweakHub — offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #f2f4f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card { padding: 24px; max-width: 360px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #9aa3b5; font-size: 14px; line-height: 1.5; margin: 0; }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #4dd0e1;
        color: #12151c;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        TweakHub needs a connection to process files — this page is served from
        your device's cache so the app shell still loads. Reconnect and try
        again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
